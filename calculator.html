<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="css/calc.css">
  <script src="js/calc.js" defer></script>
</head>
<body>
  <div class="parent-div">
      <input type="number" required class="display">
    <div class="sub-div">
      <div class="buttons-div">
        <button class="gray-btn ac-btn">AC</button>
        <button class="gray-btn del-btn">
          <i class="fa-solid fa-delete-left"></i>
        </button>
        <button class="gray-btn">%</button>
        <button class="purple-btn">/</button>
        <button class="seven">7</button>
        <button class="eight">8</button>
        <button class="nine">9</button>
        <button class="purple-btn">X</button>
        <button class="four">4</button>
        <button class="five">5</button>
        <button class="six">6</button>
        <button class="purple-btn">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button class="one">1</button>
        <button class="two">2</button>
        <button class="three">3</button>
        <button class="purple-btn">+</button>
        <button class="zero">0</button>
        <button>.</button>
        <button class="purple-btn">=</button>
      </div>
    </div>
  </div>

  <a href="index.html" target="_blank">
    <button class="next-page">
      AI Image Generator
      <i class="fa-solid fa-circle-right"></i>
    </button>
  </a>
  
  <a href="todo-list.html" target="_blank">
    <button class="next-page">
      To Do List
      <i class="fa-solid fa-circle-right"></i>
    </button>
  </a>
  
</body>
</html>
