<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="css/calc.css">
</head>
<body>
  <div class="parent-div">
    <div class="display">
      <p>0123456789</p>
    </div>
    <div class="sub-div">
      <div class="buttons-div">
        <button class="gray-btn">AC</button>
        <button class="gray-btn">
          <i class="fa-solid fa-delete-left"></i>
        </button>
        <button class="gray-btn">%</button>
        <button class="purple-btn" >/</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="purple-btn">X</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="purple-btn">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="purple-btn">+</button>
        <button>0</button>
        <button>.</button>
        <button class="purple-btn">=</button>
      </div>
    </div>
  </div>
</body>
</html>
